<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tb-metal" x1="60" y1="30" x2="140" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF6FD" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#132C52" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#tb-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Airfoil Blade Body (Curved Aerodynamic Profile) -->
  <path d="M96 28 C 114 45, 126 95, 120 135 L 88 135 C 82 95, 78 50, 96 28 Z" fill="url(#tb-metal)" stroke="#0B1F3A" stroke-width="2.5" />

  <!-- Leading Edge Highlight / Airflow Spine -->
  <path d="M106 35 C 118 60, 122 100, 116 135" stroke="#2D9CDB" stroke-width="2.5" stroke-linecap="round" />

  <!-- Internal Convection Cooling Film Holes -->
  <circle cx="104" cy="55" r="2.5" fill="#0B1F3A" />
  <circle cx="106" cy="72" r="2.5" fill="#0B1F3A" />
  <circle cx="106" cy="89" r="2.5" fill="#0B1F3A" />
  <circle cx="104" cy="106" r="2.5" fill="#0B1F3A" />
  <circle cx="100" cy="122" r="2.5" fill="#0B1F3A" />

  <!-- Blade Platform -->
  <path d="M72 135 L 132 135 L 126 145 L 78 145 Z" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2" />

  <!-- Fir-Tree / Dovetail Root Geometry (Retention Serrations) -->
  <path d="M82 145 L 82 149 L 76 153 L 84 157 L 78 161 L 86 165 L 82 172 L 122 172 L 118 165 L 126 161 L 120 157 L 128 153 L 122 149 L 122 145 Z" fill="#132C52" stroke="#2D9CDB" stroke-width="1.5" />

  <!-- Aerodynamic Flow Guide Lines -->
  <path d="M52 60 Q 64 68 62 82" stroke="#2D9CDB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" />
  <path d="M142 70 Q 150 82 144 98" stroke="#2D9CDB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" />

  <!-- Badge Accent -->
  <rect x="76" y="174" width="48" height="15" rx="3" fill="#0B1F3A" />
  <text x="100" y="184" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle" letter-spacing="1">HPT BLADE</text>
</svg>

