<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="fa-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="fa-metal" x1="60" y1="40" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#EAF6FD" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#fa-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Center Hexagonal Aerospace Bolt (Angled 3D Isometric View) -->
  <!-- Bolt Head Hexagon -->
  <polygon points="100,32 136,52 136,78 100,98 64,78 64,52" fill="url(#fa-metal)" stroke="#0B1F3A" stroke-width="3" stroke-linejoin="round" />
  <polygon points="100,32 100,98 64,78 64,52" fill="#E2E8F0" opacity="0.6" />
  
  <!-- Recessed Drive / Safety Wire Lock Hole -->
  <circle cx="100" cy="65" r="10" fill="#0B1F3A" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="100" cy="65" r="3.5" fill="#2D9CDB" />

  <!-- Cylindrical Threaded Shank (Lower Body) -->
  <rect x="80" y="96" width="40" height="58" fill="url(#fa-metal)" stroke="#0B1F3A" stroke-width="2.5" />
  
  <!-- Precision Aerospace Threads (Ridge Pattern) -->
  <line x1="77" y1="108" x2="123" y2="114" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" />
  <line x1="77" y1="118" x2="123" y2="124" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" />
  <line x1="77" y1="128" x2="123" y2="134" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" />
  <line x1="77" y1="138" x2="123" y2="144" stroke="#0B1F3A" stroke-width="2" stroke-linecap="round" />

  <!-- Chamfered Point End -->
  <polygon points="80,154 86,162 114,162 120,154" fill="#132C52" stroke="#0B1F3A" stroke-width="2" />

  <!-- Left Side Small Rivet (Flush Head) -->
  <circle cx="48" cy="115" r="12" fill="#FFFFFF" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="48" cy="115" r="3" fill="#0B1F3A" />

  <!-- Right Side Castellated Nut -->
  <rect x="140" y="105" width="22" height="24" rx="2" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2" />
  <line x1="145" y1="105" x2="145" y2="112" stroke="#0B1F3A" stroke-width="2" />
  <line x1="151" y1="105" x2="151" y2="112" stroke="#0B1F3A" stroke-width="2" />
  <line x1="157" y1="105" x2="157" y2="112" stroke="#0B1F3A" stroke-width="2" />

  <!-- Badge Accent -->
  <rect x="70" y="166" width="60" height="18" rx="4" fill="#0B1F3A" />
  <text x="100" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">FASTENERS</text>
</svg>

