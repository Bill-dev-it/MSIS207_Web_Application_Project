<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="se-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#se-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Transducer Housing (Hex Body with Connector Collar) -->
  <rect x="76" y="80" width="48" height="52" rx="6" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2.5" />

  <!-- Stainless Sensor Probe Stem (Pointing Upwards) -->
  <rect x="94" y="38" width="12" height="42" fill="#EAF6FD" stroke="#0B1F3A" stroke-width="2" />
  
  <!-- Probe Tip (Thermocouple / Pressure Sensing Orifice) -->
  <path d="M94 38 C 94 30, 106 30, 106 38 Z" fill="#2D9CDB" stroke="#0B1F3A" stroke-width="2" />
  <circle cx="100" cy="35" r="2" fill="#FFFFFF" />

  <!-- Threaded Mounting Boss (Hex Flange) -->
  <path d="M70 74 L 130 74 L 126 82 L 74 82 Z" fill="#CBD5E1" stroke="#0B1F3A" stroke-width="2" />

  <!-- Telemetry Sensor Status Indicator Rings / Signal Waves -->
  <circle cx="100" cy="106" r="14" fill="#132C52" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="100" cy="106" r="5" fill="#2D9CDB" />

  <!-- Radiating Telemetry Frequency Waves (Left & Right) -->
  <path d="M64 96 C 54 102, 54 110, 64 116" stroke="#2D9CDB" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M52 90 C 40 98, 40 114, 52 122" stroke="#2D9CDB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none" />

  <path d="M136 96 C 146 102, 146 110, 136 116" stroke="#2D9CDB" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M148 90 C 160 98, 160 114, 148 122" stroke="#2D9CDB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none" />

  <!-- Cable Gland Output (Bottom) -->
  <rect x="92" y="132" width="16" height="18" rx="2" fill="#CBD5E1" stroke="#0B1F3A" stroke-width="2" />
  <path d="M100 150 Q 100 162 116 164" stroke="#0B1F3A" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Badge Accent -->
  <rect x="74" y="166" width="52" height="18" rx="4" fill="#0B1F3A" />
  <text x="100" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">SENSORS</text>
</svg>

