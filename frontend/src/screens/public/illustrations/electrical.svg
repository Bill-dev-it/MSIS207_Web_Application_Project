<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="el-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#el-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Power Distribution Unit / Generator Casing -->
  <rect x="42" y="55" width="116" height="85" rx="8" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3" />
  
  <!-- Cooling Heat Sink Fins (Top) -->
  <path d="M52 43 L 52 55 M 68 43 L 68 55 M 84 43 L 84 55 M 100 43 L 100 55 M 116 43 L 116 55 M 132 43 L 132 55 M 148 43 L 148 55" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Circuit Trace Nodes & Busbar -->
  <rect x="52" y="66" width="96" height="63" rx="4" fill="#EAF6FD" stroke="#2D9CDB" stroke-width="1.5" />

  <!-- Wiring Terminal Connectors -->
  <circle cx="70" cy="85" r="7" fill="#0B1F3A" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="100" cy="85" r="7" fill="#0B1F3A" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="130" cy="85" r="7" fill="#0B1F3A" stroke="#2D9CDB" stroke-width="2" />

  <!-- Integrated Relay / Lightning Energy Symbol -->
  <path d="M103 103 L 95 115 L 102 115 L 97 127 L 109 113 L 101 113 Z" fill="#2D9CDB" stroke="#0B1F3A" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Wire Harness Bundles (Output Lines) -->
  <path d="M70 92 C 70 115, 60 148, 48 155" stroke="#0B1F3A" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M130 92 C 130 115, 140 148, 152 155" stroke="#2D9CDB" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Terminal Lug Rings -->
  <circle cx="48" cy="155" r="4" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2" />
  <circle cx="152" cy="155" r="4" fill="#FFFFFF" stroke="#2D9CDB" stroke-width="2" />

  <!-- Badge Accent -->
  <rect x="70" y="162" width="60" height="18" rx="4" fill="#0B1F3A" />
  <text x="100" y="174" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">ELECTRICAL</text>
</svg>

