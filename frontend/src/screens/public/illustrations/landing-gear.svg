<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="lg-tire" x1="50" y1="130" x2="150" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#lg-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Main Oleo Shock Strut (Vertical Column) -->
  <rect x="91" y="24" width="18" height="65" rx="3" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2.5" />

  <!-- Trunnion / Top Airframe Mount Lug -->
  <path d="M85 24 L 115 24 L 110 32 L 90 32 Z" fill="#0B1F3A" />
  <circle cx="100" cy="28" r="3" fill="#2D9CDB" />

  <!-- Chrome Inner Cylinder / Telescoping Piston -->
  <rect x="94" y="85" width="12" height="30" fill="#EAF6FD" stroke="#0B1F3A" stroke-width="2" />

  <!-- Torque Links / Scissor Hinge (Maintains Wheel Alignment) -->
  <polyline points="109,68 126,82 109,96" stroke="#2D9CDB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="109" cy="68" r="3" fill="#0B1F3A" />
  <circle cx="126" cy="82" r="3" fill="#0B1F3A" />
  <circle cx="109" cy="96" r="3" fill="#0B1F3A" />

  <!-- Wheel Axle Collar & Brake Assembly -->
  <rect x="80" y="112" width="40" height="10" rx="2" fill="#132C52" stroke="#0B1F3A" stroke-width="2" />

  <!-- Aviation Dual Wheel Assembly (Tires & Rims) -->
  <!-- Left Wheel -->
  <rect x="52" y="105" width="28" height="48" rx="6" fill="url(#lg-tire)" stroke="#0B1F3A" stroke-width="2.5" />
  <ellipse cx="66" cy="129" rx="8" ry="14" fill="#FFFFFF" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="66" cy="129" r="4" fill="#0B1F3A" />

  <!-- Right Wheel -->
  <rect x="120" y="105" width="28" height="48" rx="6" fill="url(#lg-tire)" stroke="#0B1F3A" stroke-width="2.5" />
  <ellipse cx="134" cy="129" rx="8" ry="14" fill="#FFFFFF" stroke="#2D9CDB" stroke-width="2" />
  <circle cx="134" cy="129" r="4" fill="#0B1F3A" />

  <!-- Badge Accent -->
  <rect x="66" y="162" width="68" height="18" rx="4" fill="#0B1F3A" />
  <text x="100" y="174" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">LANDING GEAR</text>
</svg>

