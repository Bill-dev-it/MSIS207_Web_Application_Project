<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="av-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="av-screen" x1="45" y1="45" x2="155" y2="155" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="100%" stop-color="#143D63" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#av-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Avionics LRU Bezel / Frame -->
  <rect x="34" y="34" width="132" height="132" rx="12" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="3" />
  
  <!-- Screws on Bezel -->
  <circle cx="44" cy="44" r="2.5" fill="#64748B" />
  <circle cx="156" cy="44" r="2.5" fill="#64748B" />
  <circle cx="44" cy="156" r="2.5" fill="#64748B" />
  <circle cx="156" cy="156" r="2.5" fill="#64748B" />

  <!-- Glass Cockpit Display Screen -->
  <rect x="46" y="46" width="108" height="108" rx="6" fill="url(#av-screen)" stroke="#2D9CDB" stroke-width="1.5" />

  <!-- Primary Flight Display: Pitch Ladder & Artificial Horizon -->
  <line x1="56" y1="96" x2="144" y2="96" stroke="#2D9CDB" stroke-width="1.5" stroke-dasharray="6 3" />
  <path d="M78 84 L 122 84 M 86 72 L 114 72 M 78 108 L 122 108 M 86 120 L 114 120" stroke="#EAF6FD" stroke-width="1.5" stroke-linecap="round" />

  <!-- Flight Director Aircraft Symbol -->
  <path d="M70 96 L 90 96 L 100 86 L 110 96 L 130 96" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="100" cy="96" r="2.5" fill="#F59E0B" />

  <!-- Roll Scale Arc (Top) -->
  <path d="M76 60 Q 100 50 124 60" stroke="#2D9CDB" stroke-width="1.5" fill="none" />
  <polygon points="100,52 97,57 103,57" fill="#FFFFFF" />

  <!-- Telemetry Digital Readouts -->
  <rect x="52" y="52" width="22" height="10" rx="2" fill="#0B1F3A" stroke="#2D9CDB" stroke-width="0.8" />
  <text x="63" y="60" fill="#2D9CDB" font-family="monospace" font-size="6.5" font-weight="700" text-anchor="middle">280K</text>

  <rect x="126" y="52" width="22" height="10" rx="2" fill="#0B1F3A" stroke="#2D9CDB" stroke-width="0.8" />
  <text x="137" y="60" fill="#2D9CDB" font-family="monospace" font-size="6.5" font-weight="700" text-anchor="middle">FL350</text>

  <!-- Technical Spec Badge Accent -->
  <rect x="74" y="162" width="52" height="18" rx="4" fill="#0B1F3A" />
  <text x="100" y="174" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">AVIONICS</text>
</svg>

