<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="ap-bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="ap-panel" x1="40" y1="40" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EAF6FD" />
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="16" fill="url(#ap-bg)" />
  <circle cx="100" cy="100" r="75" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Surrounding Aircraft Skin Structure (Cutout Aperture) -->
  <rect x="36" y="36" width="128" height="118" rx="14" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2" />

  <!-- Removable Inspection Access Panel Plate (Flush Mounted) -->
  <rect x="44" y="44" width="112" height="102" rx="10" fill="url(#ap-panel)" stroke="#2D9CDB" stroke-width="2.5" />

  <!-- Perimeter Fastener Screws / Camloc 1/4-Turn Flush Studs -->
  <!-- Top & Bottom Row -->
  <circle cx="56" cy="54" r="2.5" fill="#0B1F3A" />
  <circle cx="85" cy="54" r="2.5" fill="#0B1F3A" />
  <circle cx="115" cy="54" r="2.5" fill="#0B1F3A" />
  <circle cx="144" cy="54" r="2.5" fill="#0B1F3A" />
  <circle cx="56" cy="136" r="2.5" fill="#0B1F3A" />
  <circle cx="85" cy="136" r="2.5" fill="#0B1F3A" />
  <circle cx="115" cy="136" r="2.5" fill="#0B1F3A" />
  <circle cx="144" cy="136" r="2.5" fill="#0B1F3A" />
  <!-- Left & Right Sides -->
  <circle cx="56" cy="95" r="2.5" fill="#0B1F3A" />
  <circle cx="144" cy="95" r="2.5" fill="#0B1F3A" />

  <!-- Center Honeycomb Composite Core / Stiffener Ribs -->
  <rect x="70" y="68" width="60" height="54" rx="4" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5" stroke-dasharray="3 2" />
  
  <!-- Flush Pull-Ring Latch / Quick Release Mechanism -->
  <rect x="86" y="86" width="28" height="18" rx="3" fill="#132C52" stroke="#2D9CDB" stroke-width="1.5" />
  <circle cx="100" cy="95" r="4" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5" />

  <!-- Grounding Bonding Jumper Strap (Top Corner) -->
  <path d="M42 42 Q 34 32 46 28" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" fill="none" />
  <circle cx="46" cy="28" r="2" fill="#0B1F3A" />

  <!-- Badge Accent -->
  <rect x="64" y="166" width="72" height="18" rx="4" fill="#0B1F3A" />
  <text x="100" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="1">ACCESS PANEL</text>
</svg>

